[build-system]
requires = ["setuptools>=77"]  # SPDX license string
build-backend = "setuptools.build_meta"

[project]
name = "audio-book-generator"
description = "Turn PDFs (text or scanned) into proper EPUBs, and EPUBs into naturally narrated audiobooks, with free local voices"
readme = "README.md"
license = "MIT"
authors = [{ name = "Yogesh" }]
keywords = ["audiobook", "epub", "pdf", "ocr", "text-to-speech", "tts", "kokoro", "m4b"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
    "Topic :: Text Processing :: Markup :: XML",
]
requires-python = ">=3.10,<3.14"
dependencies = [
    "kokoro-onnx>=0.6.1",
    "beautifulsoup4>=4.12",
    "lxml>=5",
    "num2words>=0.5.13",
    "numpy>=2",
    "pypdf>=5",
]
dynamic = ["version"]

[project.urls]
Homepage = "https://github.com/y-v-j/audio-book-generator"
Issues = "https://github.com/y-v-j/audio-book-generator/issues"

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
abgen = "abgen.cli:main"

[tool.setuptools.dynamic]
version = { attr = "abgen.__version__" }

[tool.setuptools.packages.find]
include = ["abgen*"]

[tool.pytest.ini_options]
markers = ["slow: runs the speech model (needs the downloaded model files)"]
